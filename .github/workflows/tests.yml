name: Tests

# Builds Cutter with its tests and runs each test layer as its own step, on Linux, macOS and
# Windows. The sanitizer runs are in sanitizers.yml, since they take much longer.

on:
  push:
    branches:
    - dev
    - stable
  pull_request:
    branches:
    - dev
    - stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-14
          - name: windows
            os: windows-2022
    defaults:
      run:
        shell: bash
    steps:
    - name: Check Out Cutter
      uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set Up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.12.x

    - name: Install Dependencies
      run: |
        pip install --no-cache-dir meson ninja
        case "$RUNNER_OS" in
        Linux)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libpcre2-dev \
              mesa-common-dev libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-dev ;;
        macOS)
          brew install pkg-config || brew link --overwrite pkgconf ;;
        Windows)
          choco install winflexbison3 pkgconfiglite -y
          vcpkg install zlib:x64-windows ;;
        esac
        scripts/fetch_deps.sh

    - name: Restore Test Fixtures
      uses: actions/cache@v4
      with:
        path: build/test-fixtures
        key: test-fixtures-${{ hashFiles('test/common/Fixtures.cmake') }}

    - name: Set Up ccache
      if: runner.os != 'Windows'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: tests-${{ matrix.name }}
        max-size: 2G

    - name: Build Cutter
      run: |
        if [ "$RUNNER_OS" = Windows ]; then
          cmd.exe //c 'scripts\build-tests.bat'
        else
          bash scripts/build-tests.sh
        fi
        echo BUILT=1 >>"$GITHUB_ENV"

    # One step per layer, so each shows on its own. They all run even if an earlier one fails.
    - name: Run Unit Tests
      if: ${{ !cancelled() && env.BUILT == '1' }}
      run: ctest --test-dir build -L '^unit$' --output-on-failure
    - name: Run Session Tests
      if: ${{ !cancelled() && env.BUILT == '1' }}
      run: ctest --test-dir build -L '^session$' --output-on-failure
    - name: Run Dialog Tests
      if: ${{ !cancelled() && env.BUILT == '1' }}
      run: ctest --test-dir build -L '^dialogs$' --output-on-failure
    - name: Run Workflow Tests
      if: ${{ !cancelled() && env.BUILT == '1' }}
      run: ctest --test-dir build -L '^workflows$' --output-on-failure
    - name: Run Sweep Tests
      if: ${{ !cancelled() && env.BUILT == '1' }}
      run: ctest --test-dir build -L '^sweep$' --output-on-failure
